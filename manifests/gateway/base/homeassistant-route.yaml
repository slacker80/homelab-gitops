apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homeassistant-ui
  namespace: apps-homeassistant
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: admin
    namespace: envoy-gateway-system
    sectionName: homeassistant
  hostnames:
  - homeassistant.admin.home.arpa
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ''
      kind: Service
      name: homeassistant-home-assistant
      port: 8080
