apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: haos-disk
  namespace: apps-homeassistant
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  source:
    http:
      url: REQUIRED_HAOS_IMAGE_URL
  pvc:
    accessModes:
    - ReadWriteOnce
    volumeMode: Filesystem
    storageClassName: vm-disks-retain
    resources:
      requests:
        storage: 32Gi
