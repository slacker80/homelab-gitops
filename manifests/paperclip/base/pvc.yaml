apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperclip-data
  annotations:
    # Data blijft staan bij prune en bij verwijderen van de Application.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 6Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperclip-postgres
  annotations:
    # Data blijft staan bij prune en bij verwijderen van de Application.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 8Gi
