# OWASP Top 10 Kubernetes: K03 (2022), K02/K08 (2025)
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-automount-sa-token
  annotations:
    policies.kyverno.io/title: "Disallow default automountServiceAccountToken"
    policies.kyverno.io/category: OWASP K8s Top 10
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [daemonsets, deployments, jobs, statefulsets, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false
      message: spec.automountServiceAccountToken moet expliciet false zijn.
