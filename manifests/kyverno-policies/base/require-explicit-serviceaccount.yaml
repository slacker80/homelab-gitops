apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-explicit-serviceaccount
  annotations:
    policies.kyverno.io/title: "Require Explicit Service Account"
    policies.kyverno.io/category: RBAC & Identity
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [daemonsets, deployments, jobs, statefulsets, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        has(object.spec.serviceAccountName) && object.spec.serviceAccountName != '' &&
        object.spec.serviceAccountName != 'default'
      message: Een expliciete serviceAccountName is verplicht; het default ServiceAccount is niet toegestaan.
