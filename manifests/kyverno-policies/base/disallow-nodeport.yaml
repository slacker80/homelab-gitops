# OWASP Top 10 Kubernetes: K01 (2022), K06 (2025)
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-nodeport
  annotations:
    policies.kyverno.io/title: "Disallow NodePort Services"
    policies.kyverno.io/category: OWASP K8s Top 10
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Service
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [services]
  validations:
    - expression: "!has(object.spec.type) || object.spec.type != 'NodePort'"
      message: Services van type NodePort zijn niet toegestaan. Gebruik ClusterIP, Ingress of LoadBalancer.
