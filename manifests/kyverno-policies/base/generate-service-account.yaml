apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-service-account
  annotations:
    policies.kyverno.io/title: "Auto-generate ServiceAccount per workload"
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: medium
spec:
  evaluation:
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  matchConditions:
    - name: exclude-platform-namespaces
      expression: >-
        !['kube-system', 'kyverno', 'argocd', 'karpenter',
          'cert-manager'].exists(n,
          object.metadata.namespace == n)
  variables:
    - name: downstream
      expression: >-
        [{
          "apiVersion": dyn("v1"),
          "kind": dyn("ServiceAccount"),
          "metadata": dyn({
            "name": dyn(object.metadata.name + "-sa"),
            "labels": dyn({
              "app.kubernetes.io/managed-by": "kyverno",
              "app.kubernetes.io/created-for": string(object.metadata.name)
            })
          }),
          "automountServiceAccountToken": dyn(false)
        }]
  generate:
    - expression: generator.Apply(object.metadata.namespace, variables.downstream)
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: assign-generated-service-account
  annotations:
    policies.kyverno.io/title: "Assign generated ServiceAccount to workload"
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  matchConditions:
    - name: exclude-platform-namespaces
      expression: >-
        !['kube-system', 'kyverno', 'argocd', 'karpenter',
          'cert-manager'].exists(n,
          object.metadata.namespace == n)
    - name: uses-default-service-account
      expression: >-
        object.kind == 'CronJob' ?
          object.spec.jobTemplate.spec.template.spec.?serviceAccountName.orValue('default') == 'default' :
          object.spec.template.spec.?serviceAccountName.orValue('default') == 'default'
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [JSONPatch{
            op: "add",
            path: object.kind == 'CronJob' ?
              "/spec/jobTemplate/spec/template/spec/serviceAccountName" :
              "/spec/template/spec/serviceAccountName",
            value: object.metadata.name + "-sa"
          }]
