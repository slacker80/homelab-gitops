# OWASP Top 10 Kubernetes: K08 (2022), K03 (2025)
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-secrets-in-env
  annotations:
    policies.kyverno.io/title: "Disallow Secrets in environment variables"
    policies.kyverno.io/category: OWASP K8s Top 10
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [daemonsets, deployments, jobs, statefulsets, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
  validations:
    - expression: >-
        variables.containers.all(c,
          c.?env.orValue([]).all(e,
            !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef)))
      message: Secrets injecteren via env.valueFrom.secretKeyRef is niet toegestaan.
    - expression: >-
        variables.containers.all(c,
          c.?envFrom.orValue([]).all(e, !has(e.secretRef)))
      message: Bulk-import van Secrets via envFrom.secretRef is niet toegestaan.
