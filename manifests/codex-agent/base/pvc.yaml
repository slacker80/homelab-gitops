apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codex-agent-work
  annotations:
    # Data blijft staan bij prune en bij verwijderen van de Application.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 3Gi
