# Community-chart pajikos/home-assistant-helm-chart (versie in versions.yaml).
# Uitrol blijft uit via clusterlabel apps/homeassistant=false. Open vóór aanzetten:
# image-digest, niet-root UID/GID onder PSA restricted, integraties
# (mDNS/SSDP/USB/Zigbee), LAN-poorten en eventuele aparte hardware-uitzondering.
image:
  repository: ghcr.io/home-assistant/home-assistant
  # Leeg = appVersion van de chart. Vóór aanzetten vastzetten op tag@digest.
  tag: ""
controller:
  type: Deployment
deploymentStrategy: Recreate
replicaCount: 1
hostNetwork: false
persistence:
  enabled: true
  # PVC uit manifests/homeassistant/base met Prune=false,Delete=false.
  existingClaim: homeassistant-config
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 2Gi
nodeSelector: {}
