# Centrale chartversies; alle clusters gebruiken de default tenzij expliciet overschreven.
# Werk bij een versiewijziging ook helm-values/chart-checksums.sha256 bij.

argocd:
  # renovate: datasource=helm depName=argo-cd registryUrl=https://argoproj.github.io/argo-helm
  default: "10.2.0"

kyverno:
  # renovate: datasource=helm depName=kyverno registryUrl=https://kyverno.github.io/kyverno
  default: "3.9.2"

kyverno-policies:
  # renovate: datasource=helm depName=kyverno-policies registryUrl=https://kyverno.github.io/kyverno
  default: "3.9.2"

cert-manager:
  # renovate: datasource=helm depName=cert-manager registryUrl=https://charts.jetstack.io
  default: "v1.21.0"

envoy-gateway:
  # renovate: datasource=docker depName=docker.io/envoyproxy/gateway-helm versioning=semver-coerced
  default: "1.8.3"

cilium:
  # renovate: datasource=helm depName=cilium registryUrl=https://helm.cilium.io
  default: "1.20.4"

# Community-chart (pajikos); geen officiële Home Assistant-chart.
homeassistant:
  # renovate: datasource=helm depName=home-assistant registryUrl=https://pajikos.github.io/home-assistant-helm-chart
  default: "0.3.89"

# Community-chart (jyje); geen officiële NousResearch-chart.
hermes:
  # renovate: datasource=helm depName=hermes-agent registryUrl=https://jyje.github.io/hermes-agent-helm
  default: "1.22.0"

# Generieke bjw-s app-template voor apps zonder bruikbare upstream-chart.
paperclip:
