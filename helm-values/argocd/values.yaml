crds:
  install: true
  keep: true
global:
  nodeSelector:
    kubernetes.io/os: linux
configs:
  cm:
    # Behoud Helm release-labels/selectors bij overname door <release>-talos.
    application.resourceTrackingMethod: annotation
    # Application-health is standaard niet ingebouwd; toon Synced én Healthy.
    resource.customizations.health.argoproj.io_Application: |
      hs = {status = "Progressing", message = "Wacht op sync en health"}
      if obj.status ~= nil then
        if obj.status.health ~= nil and obj.status.health.status == "Degraded" then
          hs.status = "Degraded"
          hs.message = obj.status.health.message or "Child is Degraded"
        elseif obj.status.sync ~= nil and obj.status.sync.status == "Synced"
          and obj.status.health ~= nil and obj.status.health.status == "Healthy" then
          hs.status = "Healthy"
          hs.message = "Child is Synced en Healthy"
        end
      end
      return hs
    admin.enabled: 'true'
    exec.enabled: 'true'
    resource.exclusions: |
      - apiGroups:
          - cilium.io
        kinds:
          - CiliumIdentity
        clusters:
          - "*"
    server.rbac.disableApplicationFineGrainedRBACInheritance: 'true'
  rbac:
    policy.default: ''
  params:
    server.insecure: 'false'
server:
  replicas: 2
  serviceAccount:
    create: true
    name: argocd-server
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  service:
    type: ClusterIP
  httproute:
    enabled: false
repoServer:
  replicas: 2
  serviceAccount:
    create: true
    name: argocd-repo-server
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
controller:
  serviceAccount:
    create: true
    name: argocd-application-controller
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 4Gi
applicationSet:
  replicas: 2
  serviceAccount:
    create: true
    name: argocd-applicationset-controller
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
redis:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 128Mi
