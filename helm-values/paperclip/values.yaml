# Generieke bjw-s app-template (versie in versions.yaml); geen officiële
# Paperclip-chart gevonden. Uitrol blijft uit via clusterlabel apps/paperclip=false.
# Open vóór aanzetten: build/tag@digest, health, secretnaam,
# PostgreSQL-versie/PGDATA en dump/files/keys-herstel. UID/GID, datadir en poort
# volgen de upstream Dockerfile (node 1000:1000, /paperclip, 3100); controleren
# tegen de gepinde build. Start onder PSA restricted is nog niet getest.
defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
controllers:
  server:
    type: deployment
    replicas: 1
    strategy: Recreate
    pod:
      # Vervangt defaultPodOptions.securityContext volledig (geen merge).
      securityContext:
        runAsNonRoot: true
        # Entrypoint start zonder root direct de app (geen UID-remap).
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    containers:
      app:
        image:
          repository: ghcr.io/paperclipai/paperclip
          tag: TODO-pin-tag@sha256
        envFrom: []
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 1Gi
  postgres:
    type: statefulset
    replicas: 1
    statefulset:
      serviceName:
        identifier: postgres
    pod:
      # Vervangt defaultPodOptions.securityContext volledig (geen merge).
      securityContext:
        runAsNonRoot: true
        # UID/GID van de postgres-gebruiker in het Debian-image (alpine: 70).
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    containers:
      app:
        image:
          repository: docker.io/library/postgres
          tag: TODO-pin-tag@sha256
        envFrom: []
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 1Gi
service:
  server:
    controller: server
    ports:
      http:
        # Poort nog bevestigen tegen de gepinde build.
        port: 3100
  postgres:
    controller: postgres
    ports:
      postgres:
        port: 5432
persistence:
  # PVC's uit manifests/paperclip/base met Prune=false,Delete=false.
  data:
    existingClaim: paperclip-data
    advancedMounts:
      server:
        app:
        # Pad nog bevestigen tegen de gepinde build.
        - path: /paperclip
  postgres:
    existingClaim: paperclip-postgres
    advancedMounts:
      postgres:
        app:
        - path: /var/lib/postgresql/data
  tmp:
    type: emptyDir
    globalMounts:
    - path: /tmp
  postgres-run:
    type: emptyDir
    advancedMounts:
      postgres:
        app:
        - path: /var/run/postgresql
