# Generieke bjw-s app-template (versie in versions.yaml); eigen worker zonder
# upstream-chart. Uitrol blijft uit via clusterlabel apps/opencode-agent=false.
# Open vóór aanzetten: worker-image tag@digest,
# command, poort, UID/GID, secretnaam en de gedeelde dispatcherlimiet.
defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
controllers:
  worker:
    type: deployment
    replicas: 1
    strategy: Recreate
    containers:
      app:
        image:
          repository: TODO-worker-image
          tag: TODO-pin-tag@sha256
        envFrom: []
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
persistence:
  # PVC uit manifests/opencode-agent/base met Prune=false,Delete=false.
  work:
    existingClaim: opencode-agent-work
    globalMounts:
    - path: /work
  tmp:
    type: emptyDir
    globalMounts:
    - path: /tmp
