# Enable generate success events
generateSuccessEvents: false

# Configure policy reports
policyReports:
  enabled: true

# Configure metrics
metricsService:
  create: true
  port: 8000

# Configure webhooks
webhooks:
  nodeSelector:
    kubernetes.io/os: linux
  tolerations: []

  # Webhook timeout (default is 10s, set to reasonable value)
  timeoutSeconds: 10

  # Webhook failure policy
  # Projectafspraak (admission-policy): Ignore zolang alle policies Audit zijn.
  failurePolicy: Ignore

  # TLS configuration for secure webhook communication
  # The Helm chart will generate certificates if not provided
  generateCertificate: true

# Enable PolicyExceptions so specific namespaces can be
# exempted from policies.
features:
  # Projectafspraak (admission-policy): dwing Ignore af voor alle webhooks
  # zolang alle policies Audit zijn.
  forceFailurePolicyIgnore:
    enabled: true
  # Geen report-creatie per admission request: bij sync-stormen drukt dat de
  # admission-handlers voorbij de webhook-timeout. PolicyReports blijven
  # bestaan via de background scans van de reports/background controllers.
  admissionReports:
    enabled: false
  policyExceptions:
    enabled: true
    # Empty namespace = PolicyExceptions allowed in all namespaces.
    # Restrict to "kyverno" to only allow platform-managed exceptions.
    namespace: "kyverno"
  # Disable controller-runtime metrics (port 8080) to avoid conflict
  # with other hostNetwork pods. Kyverno's own
  # metrics on port 8000 are sufficient.
  controllerRuntimeMetrics:
    bindAddress: "0"

# Global configuration
config:
  # Enable or disable resource filters
  resourceFilters:
    - "[Event,*,*]"
    - "[*,kube-system,*]"
    - "[*,kube-public,*]"
    - "[*,kube-node-lease,*]"
    - "[Node,*,*]"
    - "[APIService,*,*]"
    - "[TokenReview,*,*]"
    - "[SubjectAccessReview,*,*]"
    - "[SelfSubjectAccessReview,*,*]"
    - "[Binding,*,*]"
    - "[ReplicaSet,*,*]"
    - "[AdmissionReport,*,*]"
    - "[ClusterAdmissionReport,*,*]"
    - "[BackgroundScanReport,*,*]"
    - "[ClusterBackgroundScanReport,*,*]"

  # Exclude namespaces from Kyverno
  excludeKyvernoNamespace: true

# Network policy for Kyverno components
# This restricts network access to only what's necessary
networkPolicy:
  enabled: true
  ingressFrom: []
  egressTo: []

# RBAC configuration
rbac:
  create: true
  serviceAccount:
    create: true
    # Annotations for service account (e.g., for Workload Identity)
    annotations: {}

# Security settings
# Automatically create service accounts with minimal permissions
serviceAccounts:
  admissionController:
    create: true
    automountServiceAccountToken: true
  backgroundController:
    create: true
    automountServiceAccountToken: true
  cleanupController:
    create: true
    automountServiceAccountToken: true
  reportsController:
    create: true
    automountServiceAccountToken: true

# Pod disruption budgets for high availability
podDisruptionBudget:
  admissionController:
    enabled: true
    minAvailable: 1
  backgroundController:
    enabled: true
    minAvailable: 1
  cleanupController:
    enabled: true
    minAvailable: 1
  reportsController:
    enabled: true
    minAvailable: 1

# Limit policy updates to reduce attack surface
# Only update policies when necessary
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Logging configuration (for audit and debugging)
logging:
  level: info
  format: json

# Enable admission controller signature verification
# This ensures policies are properly signed
admissionReports:
  enabled: true

# Background scan settings
backgroundScan:
  enabled: true
  # Scan interval (set appropriately based on cluster size)
  interval: 1h
  # Skip resource filters for background scans
  skipResourceFilters: true
