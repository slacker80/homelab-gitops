# Base values for Kyverno
# Kyverno is a policy engine designed for Kubernetes
# https://kyverno.io/docs/

# CRD installation
# Must be enabled for the admission controller to work
crds:
  install: true

# Admission controller configuration
admissionController:
  replicas: 2


  # Pod security context - run as non-root user
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  # Container security context - minimize privileges
  container:
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      privileged: false
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      limits:
        memory: 384Mi
      requests:
        cpu: 100m
        memory: 128Mi

    # De defaults (QPS 20 / burst 50) verzadigen tijdens sync-stormen: de
    # vpol/mpol-handlers maken hun EphemeralReports in het admission-pad en
    # blokkeren dan op de client rate limiter tot voorbij de 10s
    # webhook-timeout (fail-closed) — applies van ArgoCD falen dan clusterbreed.
    extraArgs:
      clientRateLimitQPS: 300
      clientRateLimitBurst: 600

  # Anti-affinity for high availability
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - admission-controller
          topologyKey: kubernetes.io/hostname

# Background controller configuration
backgroundController:
  enabled: true
  replicas: 2

  # Extra RBAC voor generate policies:
  # background-controller moet ServiceAccounts, PDBs en NetworkPolicies
  # kunnen aanmaken/bijwerken/verwijderen.
  # NetworkPolicies zijn nodig voor generate-default-deny-networkpolicy
  # (OWASP K8s Top 10 - K07/2022, K05/2025).
  rbac:
    clusterRole:
      extraResources:
        - apiGroups:
            - ""
          resources:
            - serviceaccounts
          verbs:
            - create
            - update
            - patch
            - delete
        - apiGroups:
            - policy
          resources:
            - poddisruptionbudgets
          verbs:
            - create
            - update
            - patch
            - delete
        - apiGroups:
            - networking.k8s.io
          resources:
            - networkpolicies
          verbs:
            - create
            - update
            - patch
            - delete

  # Pod security context - run as non-root user
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  # Container security context - minimize privileges
  container:
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      privileged: false
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

  # Anti-affinity for high availability
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - background-controller
          topologyKey: kubernetes.io/hostname

# Cleanup controller configuration
cleanupController:
