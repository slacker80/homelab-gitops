# Reports controller configuration
reportsController:
  enabled: true
  replicas: 2

  # Pod security context - run as non-root user
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  # Container security context - minimize privileges
  container:
    securityContext:
      allowPrivilegeEscalation: false
