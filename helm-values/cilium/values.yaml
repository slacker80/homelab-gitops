ipam:
  mode: kubernetes
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
hubble:
  enabled: true
  ui:
    enabled: true
    ingress:
      enabled: false
  relay:
    enabled: true
  # Certificaten via de certgen-job i.p.v. Helm: de methode `helm` maakt bij
  # elke render nieuwe certificaten, wat onder Argo blijvende drift geeft.
  tls:
    auto:
      method: cronJob
l2announcements:
  enabled: true
operator:
  replicas: 1

# Envoy is de enige Gateway API-controller.
gatewayAPI:
  enabled: false
ingressController:
  enabled: false
