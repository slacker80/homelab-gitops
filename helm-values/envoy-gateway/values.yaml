podDisruptionBudget:
  minAvailable: 2
deployment:
  replicas: 3
  pod:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            control-plane: envoy-gateway
            app.kubernetes.io/name: gateway-helm
            app.kubernetes.io/instance: envoy-gateway
  envoyGateway:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
