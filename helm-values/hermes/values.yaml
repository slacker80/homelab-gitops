# Generieke bjw-s app-template (versie in versions.yaml); geen officiële
# NousResearch-chart. Besluit Peter (SMA-153): app-template in plaats van de
# community-chart, zodat er geen chart-Secret en geen seed-config meekomt.
# Uitrol blijft uit via clusterlabel apps/hermes=false. Open vóór aanzetten:
# image tag@digest gelijk aan de huidige Pi-build, secretnaam (lokaal
# aangemaakt, niet in Git), auth/health, toolbackend en echte netwerkstromen.
# config.yaml komt mee met de datamigratie naar /opt/data; er is geen
# seed/migrate-initcontainer zoals in de community-chart.
# UID/GID en tmpfs volgen de values-hardened.yaml van die chart (10000).
defaultPodOptions:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10000
    runAsGroup: 10000
    fsGroup: 10000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
controllers:
  gateway:
    type: deployment
    replicas: 1
    strategy: Recreate
    containers:
      app:
        image:
          repository: docker.io/nousresearch/hermes-agent
          tag: TODO-pin-tag@sha256
        args:
        - gateway
        - run
        env:
          HERMES_HOME: /opt/data
        # Lokaal aangemaakte Secret koppelen, bijv. secretRef hermes-env.
        envFrom: []
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 2Gi
persistence:
  # PVC uit manifests/hermes/base met Prune=false,Delete=false.
  data:
    existingClaim: hermes-data
    globalMounts:
    - path: /opt/data
  run:
    type: emptyDir
    medium: Memory
    sizeLimit: 16Mi
    globalMounts:
    - path: /run
  tmp:
    type: emptyDir
    medium: Memory
    sizeLimit: 64Mi
    globalMounts:
    - path: /tmp
