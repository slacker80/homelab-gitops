# Community-chart jyje/hermes-agent-helm (versie in versions.yaml).
# Uitrol blijft uit via clusterlabel apps/hermes=false. Open vóór aanzetten:
# image-digest gelijk aan de huidige Pi-build, gatewaycommand, auth/health,
# toolbackend en echte netwerkstromen. Securitycontext volgt de
# values-hardened.yaml van de chart (UID 10000, read-only root, tmpfs).
image:
  repository: nousresearch/hermes-agent
  # Leeg = appVersion van de chart. Vóór aanzetten vastzetten op tag@digest.
  tag: ""
controller:
  type: deployment
replicaCount: 1
persistence:
  enabled: true
  mountPath: /opt/data
  # PVC uit manifests/hermes/base met Prune=false,Delete=false.
  existingClaim: hermes-data
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10000
  runAsGroup: 10000
  fsGroup: 10000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
extraVolumes:
- name: run-tmpfs
  emptyDir:
    medium: Memory
    sizeLimit: 16Mi
- name: tmp-tmpfs
  emptyDir:
    medium: Memory
    sizeLimit: 64Mi
extraVolumeMounts:
- name: run-tmpfs
  mountPath: /run
- name: tmp-tmpfs
  mountPath: /tmp
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 2Gi
nodeSelector: {}
# De chart zet `env` altijd in een eigen Secret. `env: {}` laat de default
# OPENAI_API_KEY-placeholder staan (Helm merget maps); de key op `null` zetten
# verwijdert hem (`env: null` faalt op het chartschema).
# Geen sleutels in Git: echte sleutels via een lokaal aangemaakte Secret
# koppelen (extraEnvFrom). De chart rendert dan nog een lege Secret; project
# workloads blokkeert kind Secret. Keuze open, zie preparation-state.yaml.
env:
  OPENAI_API_KEY: null
extraEnvFrom: []
# Helm-testjob uit; Argo slaat testhooks ook over.
tests:
  enabled: false
