  - Pin local-path-provisioner 0.0.37 met namespace local-path-storage (PSA privileged via managedNamespaceMetadata) en Talos UserVolumes met Retain.
  - Complete componentgerichte CNPs vóór inschakelen CCNP; echte poorten en bestemmingen controleren.
  - Argo Application-health en controller/CRD/webhook-readiness uitwerken; waves alleen zijn onvoldoende.
  - Dispatcher/bridge met maximaal één actieve taak en gezamenlijk 2Gi codingbudget aantoonbaar afdwingen.
  - Lokaal secrets-script en versleutelde externe herstelset voorbereiden; script maakt zo nodig de namespace zonder labels aan.
  - Gateway API, TLS en eventuele Issuer invullen met echte adressen en namen.
  - Afzonderlijke live autorisatie, directe API-route, functionele tests en herstelproef op SMA-102.
