  - Root, repositorytoegang en AppProject platform bij bootstrap; root valt buiten zijn eigen child-set.
  - Pin echte app/workerimages (tag@digest), commando's, UID/GID onder PSA restricted, probes en secretnamen; vervang alle TODO-waarden.
