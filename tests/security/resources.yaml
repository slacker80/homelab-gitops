# Offline voorbeelden op basis van de gepinde broncode; geen runtime-render van virt-launcher/handler.
apiVersion: v1
kind: Pod
metadata:
  name: privileged-handler
  namespace: kubevirt
  labels:
    kubevirt.io: virt-handler
  ownerReferences:
  - apiVersion: apps/v1
    kind: DaemonSet
    name: virt-handler
    uid: 00000000-0000-0000-0000-000000000001
    controller: true
spec:
  securityContext:
    runAsUser: 0
  containers:
  - name: compute
    image: registry.k8s.io/pause:3.10
    securityContext:
      privileged: true
      runAsUser: 0
  serviceAccountName: kubevirt-handler
  hostPID: true
  volumes:
  - name: host
    hostPath:
      path: /var/lib/kubelet
---
apiVersion: v1
kind: Pod
metadata:
  name: restricted-launcher
  namespace: apps-homeassistant
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 107
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: compute
    image: registry.k8s.io/pause:3.10
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
        add:
        - NET_BIND_SERVICE
---
