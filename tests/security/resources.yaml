apiVersion: v1
kind: Pod
metadata:
  annotations:
    openshift.io/required-scc: restricted-v2
  labels:
    kubevirt.io: virt-operator
    name: virt-operator
    np.kubevirt.io/allow-access-cluster-services: 'true'
    prometheus.kubevirt.io: 'true'
  name: kubevirt-operator-fixture
  namespace: kubevirt
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - preference:
          matchExpressions:
          - key: node-role.kubernetes.io/worker
            operator: DoesNotExist
        weight: 100
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
        - matchExpressions:
          - key: node-role.kubernetes.io/master
            operator: Exists
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: kubevirt.io
              operator: In
              values:
              - virt-operator
          topologyKey: kubernetes.io/hostname
        weight: 1
  containers:
  - args:
    - --port
    - '8443'
    - -v
    - '2'
    command:
    - virt-operator
    env:
    - name: VIRT_OPERATOR_IMAGE
      value: quay.io/kubevirt/virt-operator:v1.9.1
    - name: WATCH_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.annotations['olm.targetNamespaces']
    - name: KUBEVIRT_VERSION
      value: v1.9.1
    image: quay.io/kubevirt/virt-operator:v1.9.1
    imagePullPolicy: IfNotPresent
    livenessProbe:
      httpGet:
        path: /metrics
        port: 8443
        scheme: HTTPS
      initialDelaySeconds: 5
      timeoutSeconds: 10
    name: virt-operator
    ports:
    - containerPort: 8443
      name: metrics
      protocol: TCP
    - containerPort: 8444
      name: webhooks
      protocol: TCP
    readinessProbe:
      httpGet:
        path: /metrics
        port: 8443
        scheme: HTTPS
      initialDelaySeconds: 5
      timeoutSeconds: 10
    resources:
      requests:
        cpu: 10m
        memory: 450Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
    terminationMessagePolicy: FallbackToLogsOnError
    volumeMounts:
    - mountPath: /etc/virt-operator/certificates
      name: kubevirt-operator-certs
      readOnly: true
    - mountPath: /profile-data
      name: profile-data
  nodeSelector:
    kubernetes.io/os: linux
  priorityClassName: kubevirt-cluster-critical
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: kubevirt-operator
  tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
  - effect: NoSchedule
    key: node-role.kubernetes.io/master
    operator: Exists
  volumes:
  - name: kubevirt-operator-certs
    secret:
      optional: true
      secretName: kubevirt-operator-certs
  - emptyDir: {}
    name: profile-data
---
apiVersion: v1
kind: Pod
metadata:
  annotations:
    openshift.io/required-scc: restricted-v2
  labels:
    cdi.kubevirt.io: cdi-operator
    name: cdi-operator
    np.kubevirt.io/allow-access-cluster-services: 'true'
    operator.cdi.kubevirt.io: ''
    prometheus.cdi.kubevirt.io: 'true'
  name: cdi-operator-fixture
  namespace: cdi
spec:
  affinity:
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: cdi.kubevirt.io
              operator: In
              values:
              - cdi-operator
          topologyKey: kubernetes.io/hostname
        weight: 1
  containers:
  - env:
    - name: DEPLOY_CLUSTER_RESOURCES
      value: 'true'
    - name: OPERATOR_VERSION
      value: v1.66.1
    - name: CONTROLLER_IMAGE
      value: quay.io/kubevirt/cdi-controller:v1.66.1
    - name: IMPORTER_IMAGE
      value: quay.io/kubevirt/cdi-importer:v1.66.1
    - name: CLONER_IMAGE
      value: quay.io/kubevirt/cdi-cloner:v1.66.1
    - name: OVIRT_POPULATOR_IMAGE
      value: quay.io/kubevirt/cdi-importer:v1.66.1
    - name: APISERVER_IMAGE
      value: quay.io/kubevirt/cdi-apiserver:v1.66.1
    - name: UPLOAD_SERVER_IMAGE
      value: quay.io/kubevirt/cdi-uploadserver:v1.66.1
    - name: UPLOAD_PROXY_IMAGE
      value: quay.io/kubevirt/cdi-uploadproxy:v1.66.1
    - name: VERBOSITY
      value: '1'
    - name: PULL_POLICY
      value: IfNotPresent
    - name: MONITORING_NAMESPACE
    image: quay.io/kubevirt/cdi-operator:v1.66.1
    imagePullPolicy: IfNotPresent
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8444
        scheme: HTTP
      initialDelaySeconds: 5
      timeoutSeconds: 10
    name: cdi-operator
    ports:
    - containerPort: 8443
      name: metrics
      protocol: TCP
    - containerPort: 8444
      name: health
      protocol: TCP
    readinessProbe:
      httpGet:
        path: /readyz
        port: 8444
        scheme: HTTP
      initialDelaySeconds: 5
      timeoutSeconds: 10
    resources:
      requests:
        cpu: 100m
        memory: 150Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: FallbackToLogsOnError
  nodeSelector:
    kubernetes.io/os: linux
  securityContext:
    runAsNonRoot: true
  serviceAccountName: cdi-operator
