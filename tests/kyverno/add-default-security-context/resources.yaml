apiVersion: v1
kind: Pod
metadata:
  name: pod-without-context
spec:
  containers:
    - name: app
      image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-with-partial-capabilities
spec:
  initContainers:
    - name: setup
      image: busybox:1.37
      securityContext:
        capabilities:
          add:
            - CHOWN
  containers:
    - name: app
      image: nginx:1.27
      securityContext:
        capabilities:
          add:
            - NET_BIND_SERVICE
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-with-explicit-security-context
spec:
  securityContext:
    runAsNonRoot: false
    seccompProfile:
      type: Unconfined
  initContainers:
    - name: setup
      image: busybox:1.37
      securityContext:
        allowPrivilegeEscalation: true
        capabilities:
          add:
            - CHOWN
          drop:
            - NET_RAW
  containers:
    - name: app
      image: nginx:1.27
      securityContext:
        allowPrivilegeEscalation: true
        privileged: true
        readOnlyRootFilesystem: false
        runAsNonRoot: false
        seccompProfile:
          type: Unconfined
        capabilities:
          add:
            - NET_ADMIN
          drop: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-with-defaults
spec:
  selector:
    matchLabels:
      app: defaulted
  template:
    metadata:
      labels:
        app: defaulted
    spec:
      containers:
        - name: app
          image: nginx:1.27
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-with-defaults
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: app
              image: busybox:1.37
