apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
spec:
  sourceRepos:
  - https://github.com/slacker80/homelab-gitops.git
  destinations:
  - namespace: apps-homeassistant
    server: https://kubernetes.default.svc
  - namespace: apps-paperclip
    server: https://kubernetes.default.svc
  - namespace: apps-hermes
    server: https://kubernetes.default.svc
  - namespace: agents-claude
    server: https://kubernetes.default.svc
  - namespace: agents-codex
    server: https://kubernetes.default.svc
  - namespace: agents-opencode
    server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: Service
  - group: ''
    kind: PersistentVolumeClaim
  - group: ''
    kind: ConfigMap
  - group: apps
    kind: Deployment
  - group: apps
    kind: StatefulSet
  namespaceResourceBlacklist:
  - group: ''
    kind: Secret
  - group: cilium.io
    kind: CiliumNetworkPolicy
