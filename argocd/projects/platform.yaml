apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Shared project for homelab platform applications.
  permitOnlyProjectScopedClusters: false
  sourceRepos:
    - https://argoproj.github.io/argo-helm
    - https://helm.cilium.io
    - https://kyverno.github.io/kyverno
    - https://charts.jetstack.io
    - docker.io/envoyproxy
    - git@github.com:slacker80/homelab-gitops.git
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: kube-system
      server: https://kubernetes.default.svc
    - namespace: cilium-secrets
      server: https://kubernetes.default.svc
    - namespace: kyverno
      server: https://kubernetes.default.svc
    - namespace: cert-manager
      server: https://kubernetes.default.svc
    - namespace: envoy-gateway-system
      server: https://kubernetes.default.svc
    - namespace: apps-homeassistant
      server: https://kubernetes.default.svc
    - namespace: apps-paperclip
      server: https://kubernetes.default.svc
    - namespace: apps-hermes
      server: https://kubernetes.default.svc
    - namespace: agents-claude
      server: https://kubernetes.default.svc
    - namespace: agents-codex
      server: https://kubernetes.default.svc
    - namespace: agents-opencode
      server: https://kubernetes.default.svc
    - namespace: local-path-storage
      server: https://kubernetes.default.svc
    - namespace: kubevirt
      server: https://kubernetes.default.svc
    - namespace: cdi
      server: https://kubernetes.default.svc
    - namespace: apps-unifi-os-server
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: apiregistration.k8s.io
      kind: APIService
    - group: scheduling.k8s.io
      kind: PriorityClass
    - group: gateway.networking.k8s.io
      kind: GatewayClass
    - group: cilium.io
      kind: CiliumClusterwideNetworkPolicy
    - group: policies.kyverno.io
      kind: ValidatingPolicy
    - group: cdi.kubevirt.io
      kind: CDI
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
