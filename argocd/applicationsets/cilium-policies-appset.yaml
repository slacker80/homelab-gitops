apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cilium-policies
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchLabels:
            platform/cilium: "true"
  template:
    metadata:
      name: "cilium-policies-{{ .nameNormalized }}"
      annotations:
        argocd.argoproj.io/sync-wave: "1"
      labels:
        app.kubernetes.io/part-of: platform
        app.kubernetes.io/name: cilium-policies
        app.kubernetes.io/managed-by: argocd
    spec:
      project: platform
      source:
        repoURL: git@github.com:slacker80/homelab-gitops.git
        targetRevision: main
        path: manifests/cilium/{{ .name }}
      destination:
        server: "{{ .server }}"
        namespace: kube-system
      # Requires an existing Cilium installation; only policies are managed here.
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
  syncPolicy:
    preserveResourcesOnDeletion: true
