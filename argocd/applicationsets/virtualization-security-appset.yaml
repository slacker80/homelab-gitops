apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: virtualization-security
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - clusters:
      selector:
        matchLabels:
          platform/virtualization: 'true'
  template:
    metadata:
      name: virtualization-security-{{ .nameNormalized }}
      annotations:
        argocd.argoproj.io/sync-wave: '3'
    spec:
      project: platform
      source:
        repoURL: git@github.com:slacker80/homelab-gitops.git
        targetRevision: main
        path: manifests/virtualization-security/{{ .name }}
      destination:
        server: '{{ .server }}'
        namespace: kubevirt
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
        - ServerSideApply=true
  syncPolicy:
    preserveResourcesOnDeletion: true
