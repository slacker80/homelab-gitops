apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homeassistant
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
  - matrix:
      generators:
      - clusters:
          selector:
            matchLabels:
              apps/homeassistant: 'true'
      - git:
          repoURL: https://github.com/slacker80/homelab-gitops.git
          revision: main
          files:
          - path: helm-values/versions.yaml
  template:
    metadata:
      name: homeassistant-{{ .nameNormalized }}
    spec:
      project: workloads
      sources:
      - repoURL: https://github.com/slacker80/homelab-gitops.git
        targetRevision: main
        path: charts/homeassistant
        helm:
          releaseName: homeassistant
          valueFiles:
          - $values/helm-values/homeassistant/values.yaml
          - $values/helm-values/homeassistant/values-{{ .name }}.yaml
          ignoreMissingValueFiles: false
      - repoURL: https://github.com/slacker80/homelab-gitops.git
        targetRevision: main
        ref: values
      - repoURL: https://github.com/slacker80/homelab-gitops.git
        targetRevision: main
        path: manifests/homeassistant/{{ .name }}
      destination:
        server: '{{ .server }}'
        namespace: apps-homeassistant
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - ServerSideApply=true
