apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homeassistant
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  apps/homeassistant: 'true'
          - git:
              repoURL: https://github.com/slacker80/homelab-gitops.git
              revision: main
              files:
                - path: helm-values/versions.yaml
  template:
    metadata:
      name: homeassistant-{{ .nameNormalized }}
    spec:
      project: workloads
      sources:
        # Community-chart pajikos/home-assistant-helm-chart; geen officiële chart van Home Assistant.
        - repoURL: https://pajikos.github.io/home-assistant-helm-chart
          chart: home-assistant
          targetRevision: '{{ coalesce (index (index . "homeassistant") .name) (index (index . "homeassistant") "default") }}'
          helm:
            releaseName: homeassistant
            valueFiles:
              - $values/helm-values/homeassistant/values.yaml
              - $values/helm-values/homeassistant/values-{{ .name }}.yaml
            ignoreMissingValueFiles: false
        - repoURL: https://github.com/slacker80/homelab-gitops.git
          targetRevision: main
          ref: values
        # Extra manifests, waaronder de PVC('s) met Prune=false,Delete=false.
        - repoURL: https://github.com/slacker80/homelab-gitops.git
          targetRevision: main
          path: manifests/homeassistant/{{ .name }}
      destination:
        server: '{{ .server }}'
        namespace: apps-homeassistant
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # Argo maakt de namespace met PSA-labels aan. Zo'n namespace wordt
        # normaal niet door de Application gevolgd en dus niet verwijderd.
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: v1.36
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/warn: restricted
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
