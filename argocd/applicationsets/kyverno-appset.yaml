apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  platform/kyverno: "true"
          - git:
              repoURL: git@github.com:slacker80/homelab-gitops.git
              revision: main
              files:
                - path: helm-values/versions.yaml
  template:
    metadata:
      name: "kyverno-{{ .nameNormalized }}"
      annotations:
        argocd.argoproj.io/sync-wave: "2"
      labels:
        app.kubernetes.io/part-of: platform
        app.kubernetes.io/name: kyverno
        app.kubernetes.io/managed-by: argocd
    spec:
      project: platform
      sources:
        - repoURL: https://kyverno.github.io/kyverno
          chart: kyverno
          targetRevision: '{{ coalesce (index .kyverno .name) (index .kyverno "default") }}'
          helm:
            releaseName: kyverno
            ignoreMissingValueFiles: false
            valueFiles:
              - $values/helm-values/kyverno/values.yaml
              - $values/helm-values/kyverno/values-{{ .name }}.yaml
            parameters:
              - name: clusterName
                value: "{{ .name }}"
        - repoURL: git@github.com:slacker80/homelab-gitops.git
          targetRevision: main
          ref: values
      destination:
        server: "{{ .server }}"
        namespace: kyverno
      ignoreDifferences:
        - group: rbac.authorization.k8s.io
          kind: ClusterRole
          name: kyverno:migrate-resources
        - group: rbac.authorization.k8s.io
          kind: ClusterRoleBinding
          name: kyverno:migrate-resources
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /metadata/annotations
            - /metadata/labels
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - Force=false
          - RespectIgnoreDifferences=true
  syncPolicy:
    preserveResourcesOnDeletion: true
