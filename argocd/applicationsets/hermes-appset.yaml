apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hermes
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  apps/hermes: 'true'
          - git:
              repoURL: https://github.com/slacker80/homelab-gitops.git
              revision: main
              files:
                - path: helm-values/versions.yaml
  template:
    metadata:
      name: hermes-{{ .nameNormalized }}
    spec:
      project: workloads
      sources:
        # Community-chart jyje/hermes-agent-helm; geen officiële chart van NousResearch.
        - repoURL: https://jyje.github.io/hermes-agent-helm
          chart: hermes-agent
          targetRevision: '{{ coalesce (index (index . "hermes") .name) (index (index . "hermes") "default") }}'
          helm:
            releaseName: hermes
            valueFiles:
              - $values/helm-values/hermes/values.yaml
              - $values/helm-values/hermes/values-{{ .name }}.yaml
            ignoreMissingValueFiles: false
        - repoURL: https://github.com/slacker80/homelab-gitops.git
          targetRevision: main
          ref: values
        # Extra manifests, waaronder de PVC('s) met Prune=false,Delete=false.
        - repoURL: https://github.com/slacker80/homelab-gitops.git
          targetRevision: main
          path: manifests/hermes/{{ .name }}
      destination:
        server: '{{ .server }}'
        namespace: apps-hermes
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # Argo maakt de namespace met PSA-labels aan. Zo'n namespace wordt
        # normaal niet door de Application gevolgd en dus niet verwijderd.
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: v1.36
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/warn: restricted
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
