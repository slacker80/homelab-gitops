apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: claude-agent
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  apps/claude-agent: 'true'
          - git:
              repoURL: git@github.com:slacker80/homelab-gitops.git
              revision: main
              files:
                - path: helm-values/versions.yaml
  template:
    metadata:
      name: claude-agent-{{ .nameNormalized }}
    spec:
      project: workloads
      sources:
        # Generieke bjw-s app-template; eigen worker, dus geen upstream-chart.
        - repoURL: https://bjw-s-labs.github.io/helm-charts
          chart: app-template
          targetRevision: '{{ coalesce (index (index . "claude-agent") .name) (index (index . "claude-agent") "default") }}'
          helm:
            releaseName: claude-agent
            valueFiles:
              - $values/helm-values/claude-agent/values.yaml
              - $values/helm-values/claude-agent/values-{{ .name }}.yaml
            ignoreMissingValueFiles: false
        - repoURL: git@github.com:slacker80/homelab-gitops.git
          targetRevision: main
          ref: values
        # Extra manifests, waaronder de PVC('s) met Prune=false,Delete=false.
        - repoURL: git@github.com:slacker80/homelab-gitops.git
          targetRevision: main
          path: manifests/claude-agent/{{ .name }}
      destination:
        server: '{{ .server }}'
        namespace: agents-claude
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # Argo maakt de namespace met PSA-labels aan. Zo'n namespace wordt
        # normaal niet door de Application gevolgd en dus niet verwijderd.
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: v1.36
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/warn: restricted
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
