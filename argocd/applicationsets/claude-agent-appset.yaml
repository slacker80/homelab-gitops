apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: claude-agent
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
  - matrix:
      generators:
      - clusters:
          selector:
            matchLabels:
              apps/claude-agent: 'true'
      - git:
          repoURL: https://github.com/slacker80/homelab-gitops.git
          revision: main
          files:
          - path: helm-values/versions.yaml
  template:
    metadata:
      name: claude-agent-{{ .nameNormalized }}
    spec:
      project: workloads
      sources:
      - repoURL: https://github.com/slacker80/homelab-gitops.git
        targetRevision: main
        path: charts/claude-agent
        helm:
          releaseName: claude-agent
          valueFiles:
          - $values/helm-values/claude-agent/values.yaml
          - $values/helm-values/claude-agent/values-{{ .name }}.yaml
          ignoreMissingValueFiles: false
      - repoURL: https://github.com/slacker80/homelab-gitops.git
        targetRevision: main
        ref: values
      - repoURL: https://github.com/slacker80/homelab-gitops.git
        targetRevision: main
        path: manifests/claude-agent/{{ .name }}
      destination:
        server: '{{ .server }}'
        namespace: agents-claude
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - ServerSideApply=true
