apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - matrix:
      generators:
      - clusters:
          selector:
            matchLabels:
              platform/cert-manager: 'true'
      - git:
          repoURL: https://github.com/slacker80/homelab-gitops.git
          revision: main
          files:
          - path: helm-values/versions.yaml
  template:
    metadata:
      name: cert-manager-{{ .nameNormalized }}
      annotations:
        argocd.argoproj.io/sync-wave: '1'
      labels:
        app.kubernetes.io/part-of: platform
        app.kubernetes.io/name: cert-manager
        app.kubernetes.io/managed-by: argocd
    spec:
      project: platform
      sources:
      - repoURL: https://charts.jetstack.io
        chart: cert-manager
        targetRevision: '{{ coalesce (index (index . "cert-manager") .name) (index (index . "cert-manager") "default") }}'
        helm:
          releaseName: cert-manager
          ignoreMissingValueFiles: false
          valueFiles:
          - $values/helm-values/cert-manager/values.yaml
          - $values/helm-values/cert-manager/values-{{ .name }}.yaml
      - repoURL: https://github.com/slacker80/homelab-gitops.git
        targetRevision: main
        ref: values
      destination:
        server: '{{ .server }}'
        namespace: cert-manager
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - RespectIgnoreDifferences=true
        - ServerSideDiff=true
      ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        name: cert-manager-webhook
        jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
      - group: admissionregistration.k8s.io
        kind: MutatingWebhookConfiguration
        name: cert-manager-webhook
        jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
  syncPolicy:
    preserveResourcesOnDeletion: true
