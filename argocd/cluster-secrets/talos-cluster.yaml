# Alleen clusterregistratie: geen tokens of certificaten.
# talos is de logische Argo-naam, geen hostnaam.
apiVersion: v1
kind: Secret
metadata:
  name: talos-cluster
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    appset: managed
    argocd-install: "false"
    cilium-install: "false"
    platform/cilium: "false"
    platform/kyverno: "false"
    platform/kyverno-policies: "false"
    platform/cert-manager: "false"
    platform/envoy-gateway: "false"
    apps/homeassistant: "false"
    apps/paperclip: "false"
    apps/hermes: "false"
    apps/claude-agent: "false"
    apps/codex-agent: "false"
    apps/opencode-agent: "false"
type: Opaque
stringData:
  name: talos
  server: https://kubernetes.default.svc
  config: |
    {}
