apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  # Geen cascade-finalizer: verwijderen van root mag children niet verwijderen.
spec:
  project: platform
  source:
    repoURL: git@github.com:slacker80/homelab-gitops.git
    targetRevision: main
    path: argocd
    directory:
      recurse: true
      exclude: '{bootstrap/**}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
